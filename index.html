    <script>
      (function(){
        var killed=false;
        function done(){if(killed)return;killed=true;var s=document.getElementById('boot-splash');if(!s)return;s.style.opacity='0';setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s);},400);}
        var iv=setInterval(function(){var r=document.getElementById('root');if(r&&r.childElementCount>0){clearInterval(iv);done();}},50);
        setTimeout(function(){clearInterval(iv);done();},8000);
      })();
