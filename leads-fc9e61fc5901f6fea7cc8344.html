<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>הלידים של CombatFit</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--azure:#33C2FF;--bg:#0A0F1A;--frost:#C9D7E8;--dim:#8499B2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#0A0F1A,#0B1322);color:#F4F8FE;min-height:100vh;padding:24px 14px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:1.5rem;font-weight:900;margin-bottom:4px}
  h1 b{color:var(--azure)}
  .sub{color:var(--dim);font-size:.92rem;margin-bottom:18px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .count{background:rgba(31,162,255,.12);border:1px solid rgba(31,162,255,.4);color:var(--azure);font-weight:800;border-radius:100px;padding:6px 18px;font-size:.95rem}
  .refresh{cursor:pointer;color:var(--azure);font-weight:700;background:none;border:1px solid rgba(31,162,255,.4);border-radius:12px;padding:8px 18px;font-family:inherit;font-size:.9rem}
  .refresh:hover{background:rgba(31,162,255,.12)}
  table{width:100%;border-collapse:collapse;background:rgba(26,39,64,.5);border:1px solid rgba(31,162,255,.18);border-radius:16px;overflow:hidden}
  th{background:rgba(31,162,255,.1);color:var(--frost);font-weight:700;font-size:.8rem;text-align:right;padding:12px 14px}
  td{padding:13px 14px;border-top:1px solid rgba(255,255,255,.06);font-size:.95rem}
  td.num{color:var(--dim);width:36px}
  td.c{font-weight:800;direction:ltr;text-align:right;unicode-bidi:plaintext}
  .state{text-align:center;color:var(--dim);padding:40px 10px}
  .err{color:#ff8585;font-weight:700}
  .foot{color:#56708f;font-size:.78rem;margin-top:20px;text-align:center}
  a.copy{color:var(--azure);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>Combat<b>Fit</b> · לידים</h1>
  <div class="sub">כל מי שהשאיר פרטים בדף הנחיתה</div>
  <div class="bar">
    <span class="count" id="count">טוען…</span>
    <button class="refresh" onclick="load()">רענן רשימה ↻</button>
  </div>
  <div id="content"><div class="state">טוען נתונים…</div></div>
  <div class="foot">דף פרטי · לא מאונדקס בגוגל · שמור את הקישור הזה אצלך</div>
</div>

<script>
  // The secret token lives ONLY in the URL (?token=...), never in this file.
  // Keep your full link private — it is the key to the list.
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  const FN = 'https://ujpslhbxmrpvtmdujigy.supabase.co/functions/v1/leads-view';

  function fmt(iso){
    try{
      return new Date(iso).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }catch(e){ return iso; }
  }

  async function load(){
    const content = document.getElementById('content');
    const countEl = document.getElementById('count');
    if(!TOKEN){
      countEl.textContent = '🔒 נעול';
      content.innerHTML = '<div class="state err">הקישור חסר טוקן גישה.<br>פתח את הקישור הפרטי המלא (עם ‎?token=‎) שקיבלת.</div>';
      return;
    }
    countEl.textContent = 'טוען…';
    content.innerHTML = '<div class="state">טוען נתונים…</div>';
    try{
      const res = await fetch(FN + '?token=' + encodeURIComponent(TOKEN));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const leads = data.leads || [];
      countEl.textContent = 'סה״כ: ' + leads.length;

      if(!leads.length){
        content.innerHTML = '<div class="state">עדיין אין לידים — כשמישהו ישאיר פרטים הוא יופיע כאן.</div>';
        return;
      }
      let rows = '';
      leads.forEach((l,i) => {
        rows += '<tr><td class="num">' + (leads.length - i) + '</td>' +
                '<td>' + escapeHtml(l.name || '—') + '</td>' +
                '<td class="c">' + escapeHtml(l.contact) + '</td>' +
                '<td>' + escapeHtml(fmt(l.created_at)) + '</td></tr>';
      });
      content.innerHTML =
        '<table><thead><tr><th>#</th><th>שם</th><th>טלפון</th><th>מתי</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }catch(err){
      countEl.textContent = 'שגיאה';
      content.innerHTML = '<div class="state err">לא הצלחנו לטעון את הרשימה.<br>בדוק חיבור אינטרנט ונסה שוב.</div>';
      console.error(err);
    }
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  load();
</script>
</body>
</html>
